<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizCast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   QUIZCAST — DESIGN TOKENS
   ============================================================ */
:root{
  --ink:#121020;
  --ink-2:#181530;
  --panel:#201c39;
  --panel-2:#2a2448;
  --panel-hover:#332c58;
  --border:#3a3260;
  --border-soft:#2c2650;
  --text:#f3f1fa;
  --text-dim:#a89fcc;
  --text-faint:#6f6892;
  --violet:#7c5cfc;
  --violet-soft:#5b42c4;
  --violet-glow:rgba(124,92,252,.35);
  --amber:#ffb627;
  --teal:#2fd8c9;
  --coral:#ff5d6c;
  --green:#35d07f;
  --radius-lg:20px;
  --radius:14px;
  --radius-sm:9px;
  --font-display:'Unbounded',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --shadow-1:0 8px 24px rgba(6,4,20,.35);
  --shadow-2:0 20px 60px rgba(6,4,20,.55);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(124,92,252,.16), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(47,216,201,.10), transparent 55%),
    var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--violet);color:#fff;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--panel-2);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--panel-hover);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:.01em;}
p{margin:0;}
input,textarea,select{
  font-family:inherit;color:var(--text);background:var(--ink-2);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 12px;font-size:14px;width:100%;
}
input::placeholder,textarea::placeholder{color:var(--text-faint);}
input:focus,textarea:focus,select:focus{border-color:var(--violet);}
textarea{resize:vertical;min-height:70px;font-family:inherit;}
label.field-label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.field{margin-bottom:16px;}
.hint{font-size:12px;color:var(--text-faint);margin-top:5px;line-height:1.5;}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex:0 0 230px;background:var(--ink-2);
  border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;padding:22px 16px;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 26px;}
.brand-mark{
  width:34px;height:34px;border-radius:10px;flex:0 0 34px;
  background:linear-gradient(135deg,var(--violet),var(--teal));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px var(--violet-glow);
}
.brand-mark span{width:10px;height:10px;border-radius:3px;background:var(--ink);transform:rotate(45deg);}
.brand-word{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:.02em;}
.brand-word em{font-style:normal;color:var(--teal);}
.nav{display:flex;flex-direction:column;gap:3px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;
  color:var(--text-dim);font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;
  transition:background .15s,color .15s;
}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.85;}
.nav-item:hover{background:var(--panel);color:var(--text);}
.nav-item.active{background:var(--panel-2);color:var(--text);border-color:var(--border);}
.nav-item.active svg{opacity:1;color:var(--teal);}
.nav-sep{height:1px;background:var(--border-soft);margin:14px 4px;}
.sidebar-cta{
  margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,var(--violet),#9b7bff);color:#fff;font-weight:700;font-size:13.5px;
  padding:12px;border-radius:12px;cursor:pointer;border:none;box-shadow:0 8px 22px var(--violet-glow);
  transition:transform .15s, box-shadow .15s;
}
.sidebar-cta:hover{transform:translateY(-1px);box-shadow:0 10px 26px var(--violet-glow);}
.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;}
.lang-switch{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px;}
.lang-switch button{
  flex:1;background:transparent;border:none;color:var(--text-faint);font-weight:700;font-size:12px;
  padding:7px 0;border-radius:8px;cursor:pointer;letter-spacing:.04em;
}
.lang-switch button.active{background:var(--violet);color:#fff;}
.storage-note{font-size:10.5px;color:var(--text-faint);line-height:1.5;padding:0 4px;}

.main{flex:1;min-width:0;padding:30px 40px 70px;max-width:1360px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;gap:16px;flex-wrap:wrap;}
.topbar h1{font-size:26px;font-weight:800;}
.topbar .sub{color:var(--text-dim);font-size:13.5px;margin-top:4px;}
.topbar-actions{display:flex;gap:10px;flex-wrap:wrap;}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  border-radius:10px;font-weight:700;font-size:13.5px;padding:10px 16px;
  cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap;
}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--violet);color:#fff;box-shadow:0 6px 16px var(--violet-glow);}
.btn-primary:hover{background:var(--violet-soft);transform:translateY(-1px);}
.btn-ghost{background:var(--panel);color:var(--text);border-color:var(--border);}
.btn-ghost:hover{background:var(--panel-hover);}
.btn-outline{background:transparent;color:var(--text-dim);border-color:var(--border);}
.btn-outline:hover{color:var(--text);border-color:var(--text-dim);}
.btn-danger{background:transparent;color:var(--coral);border-color:rgba(255,93,108,.35);}
.btn-danger:hover{background:rgba(255,93,108,.12);}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px;}
.btn-icon{padding:9px;border-radius:9px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-block{width:100%;}

/* ============================================================
   CARDS / PANELS
   ============================================================ */
.panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:22px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
.stat-card{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:18px 18px 16px;position:relative;overflow:hidden;
}
.stat-card::after{content:'';position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:var(--stat-color,var(--violet));opacity:.15;filter:blur(10px);}
.stat-num{font-family:var(--font-mono);font-size:30px;font-weight:700;color:var(--text);}
.stat-label{font-size:12px;color:var(--text-dim);margin-top:4px;font-weight:600;}

.section-title{font-size:15px;font-weight:800;margin:32px 0 14px;display:flex;align-items:center;justify-content:space-between;}
.section-title .see-all{font-size:12px;font-weight:700;color:var(--teal);cursor:pointer;}

.mini-list{display:flex;flex-direction:column;gap:2px;}
.mini-row{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;
  border:1px solid transparent;
}
.mini-row:hover{background:var(--panel-2);border-color:var(--border-soft);}
.mini-thumb{width:40px;height:40px;border-radius:8px;background:var(--panel-2);flex:0 0 40px;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:16px;}
.mini-info{flex:1;min-width:0;}
.mini-info .name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-info .meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

/* ============================================================
   QUIZ CARDS (library)
   ============================================================ */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px;}
.toolbar .search-wrap{position:relative;flex:1;min-width:220px;}
.toolbar .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-faint);}
.toolbar input[type=search]{padding-left:34px;}
.toolbar select{width:auto;min-width:130px;}
.quiz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:18px;}
.quiz-card{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;transition:transform .15s,border-color .15s;
}
.quiz-card:hover{border-color:var(--violet-soft);transform:translateY(-2px);}
.quiz-thumb{
  height:120px;background:linear-gradient(135deg,var(--panel-2),var(--ink-2));
  display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;
  background-size:cover;background-position:center;
}
.quiz-thumb .lang-badge{position:absolute;top:9px;right:9px;background:rgba(18,16,32,.75);backdrop-filter:blur(4px);font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;letter-spacing:.05em;}
.quiz-body{padding:15px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1;}
.quiz-body h3{font-size:15px;font-weight:700;line-height:1.3;}
.quiz-body .desc{font-size:12.5px;color:var(--text-dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border-soft);}
.chip-diff-facile{color:var(--green);}
.chip-diff-moyen{color:var(--amber);}
.chip-diff-difficile{color:var(--coral);}
.quiz-meta-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);margin-top:2px;}
.quiz-actions{display:flex;gap:6px;padding:12px 14px;border-top:1px solid var(--border-soft);}
.quiz-actions .btn{flex:1;padding:8px 6px;font-size:11.5px;}
.quiz-actions .btn svg{width:13px;height:13px;}
.empty-state{padding:60px 20px;text-align:center;color:var(--text-faint);}
.empty-state h3{color:var(--text-dim);font-size:16px;margin-bottom:8px;}
.empty-state svg{width:38px;height:38px;margin-bottom:14px;opacity:.5;}

/* ============================================================
   CATEGORIES
   ============================================================ */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.cat-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;}
.cat-dot{width:12px;height:12px;border-radius:4px;flex:0 0 12px;}
.cat-name{font-weight:700;font-size:13.5px;flex:1;min-width:0;}
.cat-sub{font-size:10.5px;color:var(--text-faint);}
.cat-count{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}
.color-swatches{display:flex;gap:7px;flex-wrap:wrap;}
.swatch{width:26px;height:26px;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.swatch.selected{border-color:#fff;}

/* ============================================================
   QUIZ EDITOR
   ============================================================ */
.editor-grid{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start;}
@media(max-width:980px){.editor-grid{grid-template-columns:1fr;}}
.thumb-upload{
  height:110px;border-radius:12px;border:1.5px dashed var(--border);background:var(--ink-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;
  background-size:cover;background-position:center;color:var(--text-faint);font-size:12px;text-align:center;gap:6px;flex-direction:column;
}
.thumb-upload:hover{border-color:var(--violet);}
.checkbox-row{display:flex;flex-wrap:wrap;gap:8px;}
.cat-toggle{
  font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;border:1px solid var(--border);
  color:var(--text-dim);cursor:pointer;background:var(--ink-2);
}
.cat-toggle.selected{background:var(--violet);border-color:var(--violet);color:#fff;}

.q-list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.q-list{display:flex;flex-direction:column;gap:8px;}
.q-row{
  display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border-soft);
  border-radius:12px;padding:10px 12px;cursor:default;
}
.q-row.dragging{opacity:.4;}
.q-row .drag-handle{cursor:grab;color:var(--text-faint);padding:2px;}
.q-row .q-type-icon{width:34px;height:34px;border-radius:9px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;flex:0 0 34px;font-size:15px;}
.q-row .q-num{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:22px;text-align:center;flex:0 0 22px;}
.q-row .q-info{flex:1;min-width:0;}
.q-row .q-text{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.q-row .q-meta{font-size:11px;color:var(--text-faint);margin-top:2px;}
.q-row .q-actions{display:flex;gap:4px;}
.add-q-menu{position:relative;display:inline-block;}
.dropdown{
  position:absolute;top:calc(100% + 6px);right:0;background:var(--panel-2);border:1px solid var(--border);
  border-radius:12px;box-shadow:var(--shadow-2);padding:6px;min-width:230px;z-index:40;display:none;
}
.dropdown.open{display:block;}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.dropdown-item:hover{background:var(--panel-hover);}
.dropdown-item .ic{width:28px;height:28px;border-radius:7px;background:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 28px;}
.dropdown-item small{display:block;font-weight:400;color:var(--text-faint);font-size:10.5px;}

/* ============================================================
   MODAL (question editor)
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(8,6,18,.72);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;z-index:100;padding:34px 20px;overflow-y:auto;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--ink-2);border:1px solid var(--border);border-radius:20px;width:100%;max-width:620px;
  box-shadow:var(--shadow-2);animation:modalIn .18s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border-soft);}
.modal-header h3{font-size:16px;}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto;}
.modal-footer{display:flex;justify-content:space-between;gap:10px;padding:16px 22px;border-top:1px solid var(--border-soft);}
.modal-close{cursor:pointer;color:var(--text-faint);padding:6px;border-radius:8px;}
.modal-close:hover{color:var(--text);background:var(--panel);}

.answer-edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.answer-edit-row input[type=text]{flex:1;}
.correct-radio{
  width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex:0 0 22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.correct-radio.checked{background:var(--green);border-color:var(--green);}
.correct-radio.checked::after{content:'✓';color:#0c1a12;font-size:13px;font-weight:900;}
.img-upload-box{
  border:1.5px dashed var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;
  background:var(--ink-2);position:relative;overflow:hidden;
}
.img-upload-box img{max-width:100%;max-height:170px;border-radius:8px;display:block;margin:0 auto;}
.img-upload-box .ph{color:var(--text-faint);font-size:12.5px;padding:20px 0;}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.mode-opt{
  border:1.5px solid var(--border);border-radius:10px;padding:9px 6px;text-align:center;cursor:pointer;
  font-size:11px;font-weight:700;color:var(--text-dim);background:var(--ink-2);
}
.mode-opt.selected{border-color:var(--violet);color:var(--text);background:rgba(124,92,252,.14);}
.mask-editor{position:relative;border-radius:10px;overflow:hidden;cursor:crosshair;user-select:none;background:var(--ink-2);}
.mask-editor img{width:100%;display:block;pointer-events:none;}
.mask-rect{position:absolute;background:rgba(18,16,32,.9);border:1.5px dashed var(--amber);}
.range-row{display:flex;align-items:center;gap:10px;}
.range-row input[type=range]{flex:1;accent-color:var(--violet);}
.range-row .val{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);width:40px;text-align:right;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* ============================================================
   PLAY — NORMAL MODE
   ============================================================ */
.play-wrap{max-width:820px;margin:0 auto;}
.play-progress-bar{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden;margin-bottom:22px;}
.play-progress-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--teal));transition:width .3s;}
.play-topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:12.5px;color:var(--text-dim);font-family:var(--font-mono);}
.play-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:22px;padding:34px;}
.play-question-img{width:100%;max-height:260px;object-fit:contain;border-radius:14px;margin-bottom:20px;background:var(--ink-2);}
.play-question-text{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.35;margin-bottom:26px;}
.answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:640px){.answers-grid{grid-template-columns:1fr;}}
.answer-tile{
  display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:14px;cursor:pointer;
  font-weight:700;font-size:15px;border:1.5px solid transparent;color:#fff;
  transition:transform .12s,filter .12s;position:relative;
}
.answer-tile:hover{filter:brightness(1.08);transform:translateY(-1px);}
.answer-tile:active{transform:translateY(0);}
.answer-tile .shape{width:20px;height:20px;flex:0 0 20px;}
.answer-tile.a{background:linear-gradient(135deg,#7c5cfc,#6a4ce8);}
.answer-tile.b{background:linear-gradient(135deg,#ffb627,#f29a0a);}
.answer-tile.c{background:linear-gradient(135deg,#2fd8c9,#20b8ab);}
.answer-tile.d{background:linear-gradient(135deg,#ff5d6c,#e8404f);}
.answer-tile.e{background:linear-gradient(135deg,#5ecbff,#3aa8e0);}
.answer-tile.f{background:linear-gradient(135deg,#c86bff,#a83de8);}
.answer-tile.dim{opacity:.35;filter:grayscale(.4);}
.answer-tile.correct-flag{outline:3px solid var(--green);box-shadow:0 0 0 5px rgba(53,208,127,.25);}
.answer-tile.wrong-flag{outline:3px solid var(--coral);}
.answer-tile.disabled{cursor:default;}
.feedback-banner{
  margin-top:20px;padding:14px 18px;border-radius:12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;
}
.feedback-banner.ok{background:rgba(53,208,127,.14);color:var(--green);border:1px solid rgba(53,208,127,.3);}
.feedback-banner.ko{background:rgba(255,93,108,.14);color:var(--coral);border:1px solid rgba(255,93,108,.3);}
.explanation-box{margin-top:12px;font-size:13px;color:var(--text-dim);line-height:1.6;background:var(--ink-2);border-radius:10px;padding:12px 14px;}
.play-footer{display:flex;justify-content:flex-end;margin-top:24px;}
.score-screen{text-align:center;padding:60px 20px;}
.score-num{font-family:var(--font-display);font-size:58px;font-weight:900;background:linear-gradient(135deg,var(--violet),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;}

/* ============================================================
   AUTO PLAY — BROADCAST STAGE (YouTube-style)
   ============================================================ */
.autoplay-setup{max-width:640px;margin:40px auto;}

.stage-wrap{
  position:fixed;inset:0;background:#050409;z-index:200;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-body);
}
.stage-16x9{
  width:min(100vw,177.7vh);height:min(100vh,56.3vw);position:relative;
  background:
    radial-gradient(1200px 700px at 50% -10%,rgba(124,92,252,.32),transparent 60%),
    radial-gradient(900px 500px at 110% 110%,rgba(47,216,201,.18),transparent 55%),
    radial-gradient(800px 500px at -10% 110%,rgba(255,93,108,.14),transparent 55%),
    #0a0816;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
}
.stage-16x9::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(transparent 95%,rgba(255,255,255,.04) 95%) 0 0/100% 6px,
    linear-gradient(90deg,transparent 95%,rgba(255,255,255,.04) 95%) 0 0/6px 100%;
  mix-blend-mode:overlay;opacity:.5;
}
.stage-16x9::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);
}

/* Top HUD */
.stage-top{
  position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding:18px 26px;z-index:5;
}
.stage-brand{
  display:flex;align-items:center;gap:10px;
  font-family:var(--font-display);font-weight:900;font-size:18px;letter-spacing:.04em;
}
.stage-brand-mark{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,var(--violet),var(--teal));
  display:flex;align-items:center;justify-content:center;color:#0a0816;font-weight:900;
  box-shadow:0 6px 18px var(--violet-glow);
}
.stage-brand em{font-style:normal;color:var(--teal);}
.stage-progress{
  flex:1;display:flex;align-items:center;gap:12px;margin:0 26px;
  font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
}
.stage-progress-track{
  flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;
}
.stage-progress-fill{
  height:100%;background:linear-gradient(90deg,var(--violet),var(--teal));
  border-radius:6px;box-shadow:0 0 12px var(--violet-glow);
  transition:width .5s cubic-bezier(.16,1,.3,1);
}
.stage-qcounter{font-family:var(--font-mono);font-size:12.5px;color:var(--text);font-weight:700;background:rgba(255,255,255,.06);padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.08);}
.stage-score-mini{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12.5px;color:var(--green);font-weight:700;background:rgba(53,208,127,.1);padding:6px 12px;border-radius:8px;border:1px solid rgba(53,208,127,.25);}
.stage-score-mini .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);}

/* Lower third (quiz info bar) */
.stage-lowerthird{
  position:absolute;bottom:22px;left:26px;z-index:5;display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,rgba(124,92,252,.95),rgba(155,123,255,.9));
  padding:10px 18px 10px 12px;border-radius:12px;color:#fff;
  box-shadow:0 14px 30px rgba(124,92,252,.35);max-width:60%;
}
.stage-lowerthird-icon{
  width:34px;height:34px;border-radius:9px;background:rgba(0,0,0,.2);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 34px;
}
.stage-lowerthird-info{line-height:1.2;min-width:0;}
.stage-lowerthird-name{font-family:var(--font-display);font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stage-lowerthird-meta{font-size:11px;opacity:.85;font-family:var(--font-mono);margin-top:2px;}

/* Exit / fullscreen controls */
.stage-exit{position:absolute;bottom:22px;right:26px;z-index:6;display:flex;gap:8px;opacity:0;transition:opacity .3s;}
.stage-wrap:hover .stage-exit{opacity:1;}

/* Live indicator */
.stage-live{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);
  padding:6px 14px;border-radius:30px;font-size:11px;font-weight:800;letter-spacing:.12em;
  border:1px solid rgba(255,93,108,.4);color:var(--coral);text-transform:uppercase;
}
.stage-live-dot{width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 12px var(--coral);animation:livePulse 1.4s ease-in-out infinite;}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(.7);}}

/* Main content */
.stage-content{width:min(86%,1100px);display:flex;flex-direction:column;align-items:center;position:relative;z-index:2;}

/* Timer ring */
.timer-ring{
  width:130px;height:130px;margin-bottom:20px;position:relative;
  filter:drop-shadow(0 6px 18px rgba(255,182,39,.25));
}
.timer-ring svg{transform:rotate(-90deg);width:100%;height:100%;}
.timer-ring circle{fill:none;stroke-width:7;}
.timer-ring .bg{stroke:rgba(255,255,255,.08);}
.timer-ring .fg{stroke:url(#timerGrad);stroke-linecap:round;transition:stroke-dashoffset .1s linear;}
.timer-ring .num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:38px;font-weight:900;color:#fff;
  text-shadow:0 4px 18px rgba(0,0,0,.5);
}
.timer-ring.urgent .num{color:var(--amber);animation:timerShake .35s ease-in-out infinite;}
.timer-ring.urgent .fg{stroke:var(--coral);}
@keyframes timerShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-1px);}75%{transform:translateX(1px);}}

/* Category banner above question */
.stage-catbanner{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  padding:6px 14px;border-radius:30px;
  font-family:var(--font-mono);font-size:11.5px;font-weight:700;
  color:var(--text-dim);text-transform:uppercase;letter-spacing:.12em;
  margin-bottom:14px;backdrop-filter:blur(6px);
}
.stage-catbanner .dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 8px currentColor;}
.stage-qnum{
  font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);
  letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;
}

.stage-qtext-wrap{min-height:90px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;text-align:center;}
.stage-qtext{
  font-family:var(--font-display);
  font-size:clamp(26px,3.8vw,46px);font-weight:800;
  text-align:center;line-height:1.18;
  text-shadow:0 6px 30px rgba(0,0,0,.5);
  max-width:100%;
}
.stage-qtext .hl{
  background:linear-gradient(135deg,var(--violet),var(--teal));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.stage-qimg-frame{
  position:relative;display:inline-block;margin-bottom:18px;
  border-radius:18px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.08);
}
.stage-qimg-frame::after{
  content:'';position:absolute;inset:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  border-radius:inherit;pointer-events:none;
}
.stage-qimg{max-height:30vh;max-width:100%;object-fit:contain;display:block;}

/* Answers */
.stage-answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;margin-top:18px;}
.stage-tile{
  position:relative;
  padding:18px 22px 18px 64px;border-radius:16px;
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(15px,1.65vw,21px);
  color:#fff;display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.08);
  backdrop-filter:blur(8px);
  box-shadow:0 14px 30px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
  transition:opacity .35s ease, transform .35s ease, filter .35s ease, box-shadow .35s ease, background .35s ease;
  overflow:hidden;
}
.stage-tile::before{
  content:'';position:absolute;left:-40%;top:0;bottom:0;width:40%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
  transform:skewX(-20deg);transition:left .6s ease;
}
.stage-tile:hover::before{left:120%;}
.stage-tile .letter-chip{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:900;font-size:16px;
  background:rgba(0,0,0,.35);color:#fff;
  border:1.5px solid rgba(255,255,255,.18);
  letter-spacing:0;
}
.stage-tile .shape{width:0;height:0;}
.stage-tile .answer-text{flex:1;line-height:1.25;}
.stage-tile .answer-text::first-letter{text-transform:uppercase;}
.stage-tile .tile-bg-accent{
  position:absolute;left:0;top:0;bottom:0;width:5px;
  background:var(--accent,#fff);border-radius:16px 0 0 16px;
  box-shadow:0 0 12px var(--accent,#fff);
}
.stage-tile.a{--accent:#7c5cfc;}.stage-tile.b{--accent:#ffb627;}
.stage-tile.c{--accent:#2fd8c9;}.stage-tile.d{--accent:#ff5d6c;}
.stage-tile.e{--accent:#5ecbff;}.stage-tile.f{--accent:#c86bff;}

.stage-tile.dim{opacity:.32;filter:grayscale(.7) brightness(.7);transform:scale(.96);box-shadow:none;}
.stage-tile.correct{
  background:linear-gradient(135deg,rgba(53,208,127,.95),rgba(47,216,201,.85));
  border-color:rgba(53,208,127,.6);
  box-shadow:0 0 0 4px rgba(53,208,127,.25), 0 16px 36px rgba(53,208,127,.35);
  animation:correctPop .55s cubic-bezier(.34,1.56,.64,1);
}
.stage-tile.wrong{
  background:linear-gradient(135deg,rgba(255,93,108,.85),rgba(216,60,80,.75));
  border-color:rgba(255,93,108,.55);
  animation:wrongShake .45s ease;
}
@keyframes correctPop{0%{transform:scale(1);}40%{transform:scale(1.06);box-shadow:0 0 0 12px rgba(53,208,127,.35), 0 20px 50px rgba(53,208,127,.5);}100%{transform:scale(1);}}
@keyframes wrongShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.correct-badge{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.95);color:#0c1a12;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
  animation:badgeIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes badgeIn{from{transform:translateY(-50%) scale(0) rotate(-180deg);}to{transform:translateY(-50%) scale(1) rotate(0);}}

/* Explanation banner */
.stage-explain{
  margin-top:18px;max-width:760px;text-align:center;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(8px);
  padding:14px 22px;border-radius:14px;
  color:#fff;font-size:14.5px;line-height:1.55;
  font-weight:500;
  animation:fadeUp .4s ease both;
}
.stage-explain b{color:var(--teal);font-weight:800;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* Reveal bar (under answers during reveal) */
.stage-revealbar{
  margin-top:18px;display:flex;align-items:center;gap:10px;
  font-family:var(--font-mono);font-size:12px;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;
}
.stage-revealbar .pulse{width:8px;height:8px;border-radius:50%;background:var(--coral);animation:livePulse 1s ease-in-out infinite;}

/* Intro / splash */
.stage-intro{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:10;text-align:center;padding:0 8%;
  background:radial-gradient(800px 500px at 50% 40%,rgba(124,92,252,.18),transparent 60%),rgba(5,4,9,.55);
}
.stage-intro-quizname{
  font-family:var(--font-mono);font-size:13px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--teal);margin-bottom:18px;font-weight:700;
}
.stage-intro-title{
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(34px,5.4vw,68px);line-height:1.05;
  background:linear-gradient(135deg,#fff 0%,#c4b9ff 60%,#2fd8c9 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:14px;
}
.stage-intro-sub{
  color:var(--text-dim);font-size:15px;margin-bottom:34px;font-weight:500;
}
.stage-intro-count{
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(90px,14vw,180px);
  background:linear-gradient(135deg,var(--violet),var(--teal));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1;filter:drop-shadow(0 14px 30px rgba(124,92,252,.5));
}
.stage-intro-count.pop{animation:countPop 1s ease both;}
@keyframes countPop{
  0%{opacity:0;transform:scale(.5) translateY(20px);filter:blur(8px);}
  60%{opacity:1;transform:scale(1.06) translateY(0);filter:blur(0);}
  100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0);}
}
.stage-intro-divider{
  width:120px;height:3px;background:linear-gradient(90deg,var(--violet),var(--teal));
  border-radius:3px;margin:20px auto;
  box-shadow:0 0 18px var(--violet-glow);
}
.stage-intro-tags{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.stage-intro-tag{
  font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 14px;border-radius:30px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--text-dim);
}

/* Outro / end screen */
.stage-end{
  text-align:center;display:flex;flex-direction:column;align-items:center;
}
.stage-end-trophy{
  font-size:78px;margin-bottom:8px;filter:drop-shadow(0 12px 28px rgba(255,182,39,.45));
  animation:trophyBounce 1.6s ease-in-out infinite;
}
@keyframes trophyBounce{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-10px) rotate(3deg);}}
.stage-end-title{
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(34px,5vw,60px);line-height:1.05;margin-bottom:14px;
  background:linear-gradient(135deg,#fff 0%,#c4b9ff 60%,#2fd8c9 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.stage-end-score{
  display:flex;align-items:baseline;justify-content:center;gap:14px;margin:14px 0 22px;
}
.stage-end-score .big{
  font-family:var(--font-display);font-weight:900;font-size:clamp(64px,9vw,120px);line-height:1;
  background:linear-gradient(135deg,var(--violet),var(--teal));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 10px 30px rgba(124,92,252,.45));
}
.stage-end-score .small{
  font-family:var(--font-display);font-weight:800;font-size:clamp(20px,2.4vw,28px);color:var(--text-dim);
}
.stage-end-meter{
  width:min(440px,80vw);height:10px;border-radius:10px;background:rgba(255,255,255,.08);
  overflow:hidden;margin-bottom:8px;
}
.stage-end-meter-fill{
  height:100%;background:linear-gradient(90deg,var(--coral) 0%,var(--amber) 50%,var(--green) 100%);
  border-radius:10px;box-shadow:0 0 16px var(--violet-glow);
  animation:fillMeter 1.6s cubic-bezier(.16,1,.3,1) both;
}
@keyframes fillMeter{from{width:0;}}
.stage-end-meter-label{
  font-family:var(--font-mono);font-size:12px;color:var(--text-dim);letter-spacing:.16em;text-transform:uppercase;margin-bottom:24px;
}
.stage-end-meta{
  color:var(--text-dim);font-family:var(--font-mono);
  font-size:13px;margin:4px 0 28px;
}
.stage-end-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.stage-end-actions .btn{padding:14px 24px;font-size:14.5px;}

/* Generic fade in/out animations */
.qfade-in{animation:qfadeIn .65s cubic-bezier(.16,1,.3,1) both;}
@keyframes qfadeIn{from{opacity:0;transform:translateY(18px) scale(.985);}to{opacity:1;transform:none;}}
.stage-tile{animation:tileIn .55s cubic-bezier(.16,1,.3,1) both;}
@keyframes tileIn{from{opacity:0;transform:translateY(20px) scale(.94);}to{opacity:1;transform:none;}}
.stage-fadeout{animation:stageFadeOut .35s ease both;}
@keyframes stageFadeOut{to{opacity:0;transform:scale(.98);}}
.stage-fade-out{animation:stageContentFadeOut .3s cubic-bezier(.4,0,1,1) both;}
@keyframes stageContentFadeOut{to{opacity:0;transform:translateY(-12px) scale(.98);}}
.stage-end{text-align:center;}

.confetti{position:absolute;width:8px;height:14px;top:-20px;border-radius:2px;opacity:0;animation:confettiFall 2.4s ease-in forwards;}
@keyframes confettiFall{
  0%{opacity:1;transform:translateY(0) rotate(0);}
  100%{opacity:0;transform:translateY(110vh) rotate(720deg);}
}
.stage-qimg{max-height:26vh;max-width:100%;object-fit:contain;border-radius:16px;margin-bottom:18px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
.stage-qtext{font-family:var(--font-display);font-size:clamp(22px,3.4vw,38px);font-weight:700;text-align:center;line-height:1.3;text-shadow:0 4px 20px rgba(0,0,0,.4);}
.stage-answers{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;margin-top:22px;}
.stage-tile{
  padding:20px 22px;border-radius:16px;font-family:var(--font-display);font-weight:700;font-size:clamp(15px,1.6vw,20px);
  color:#fff;display:flex;align-items:center;gap:14px;box-shadow:0 10px 26px rgba(0,0,0,.3);
  transition:opacity .35s ease, transform .35s ease, filter .35s ease, box-shadow .35s ease;
}
.stage-tile .shape{width:22px;height:22px;flex:0 0 22px;opacity:.9;}
.stage-tile.dim{opacity:.25;filter:grayscale(.6) brightness(.75);transform:scale(.96);box-shadow:none;}
.correct-badge{margin-left:auto;display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 32px;background:rgba(255,255,255,.22);border-radius:50%;}
.qfade-in{animation:qfadeIn .65s cubic-bezier(.16,1,.3,1) both;}
@keyframes qfadeIn{from{opacity:0;transform:translateY(18px) scale(.985);}to{opacity:1;transform:none;}}
.stage-tile{animation:tileIn .6s cubic-bezier(.16,1,.3,1) both;}
@keyframes tileIn{from{opacity:0;transform:translateY(22px) scale(.94);}to{opacity:1;transform:none;}}
.stage-fadeout{animation:stageFadeOut .35s ease both;}
@keyframes stageFadeOut{to{opacity:0;transform:scale(.98);}}
.stage-fade-out{animation:stageContentFadeOut .3s cubic-bezier(.4,0,1,1) both;}
@keyframes stageContentFadeOut{to{opacity:0;transform:translateY(-12px) scale(.98);}}
.stage-end{text-align:center;}
.stage-end h2{font-size:clamp(28px,4vw,44px);margin-bottom:10px;}
.correct-pulse{outline:4px solid var(--green);box-shadow:0 0 0 10px rgba(53,208,127,.22), 0 12px 30px rgba(0,0,0,.35);animation:correctPulse .5s ease;}
@keyframes correctPulse{0%{transform:scale(1);}40%{transform:scale(1.045);}100%{transform:scale(1);}}
.stage-end-emoji{font-size:46px;margin-bottom:12px;}
.stage-end-meta{color:var(--text-dim);font-family:var(--font-mono);margin:8px 0 30px;font-size:13px;}
.stage-end-actions{display:flex;gap:10px;justify-content:center;}

/* ============================================================
   TOASTS
   ============================================================ */
#toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600;
  padding:10px 18px;border-radius:30px;box-shadow:var(--shadow-1);display:flex;align-items:center;gap:8px;
  animation:toastIn .2s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.toast.ok{border-color:rgba(53,208,127,.4);}
.toast.err{border-color:rgba(255,93,108,.4);}
.toast-dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.toast.err .toast-dot{background:var(--coral);}

/* ============================================================
   MISC
   ============================================================ */
.drop-target-line{height:3px;background:var(--teal);border-radius:3px;margin:2px 0;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.processing-overlay{position:absolute;inset:0;background:rgba(18,16,32,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;}
[data-fade]{animation:qfadeIn .3s ease both;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="autoplay-root"></div>
<div id="toast-wrap"></div>
<script>

/* ============================================================
   1. STORAGE LAYER
   ============================================================ */
const _memStore = new Map();
function _memKey(key,shared){ return (shared?'S:':'P:')+key; }
function liveStorageAvailable(){ return !!(window.storage && typeof window.storage.get==='function'); }
const Store = {
  async getRaw(key, shared=false){
    if(liveStorageAvailable()){
      try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
      catch(e){ /* key not found or transient error */ return null; }
    }
    const k=_memKey(key,shared); return _memStore.has(k) ? _memStore.get(k) : null;
  },
  async setRaw(key, value, shared=false){
    if(liveStorageAvailable()){
      try{ return await window.storage.set(key, value, shared); }
      catch(e){ console.error('storage set failed', key, e); return null; }
    }
    _memStore.set(_memKey(key,shared), value);
    return {key, value, shared};
  },
  async delete(key, shared=false){
    if(liveStorageAvailable()){
      try{ return await window.storage.delete(key, shared); }
      catch(e){ return null; }
    }
    _memStore.delete(_memKey(key,shared));
    return {key, deleted:true, shared};
  },
  async list(prefix, shared=false){
    if(liveStorageAvailable()){
      try{ const r = await window.storage.list(prefix, shared); return (r && r.keys) || []; }
      catch(e){ return []; }
    }
    const pre = _memKey(prefix||'', shared);
    const out=[];
    for(const k of _memStore.keys()) if(k.startsWith(pre)) out.push(k.slice(2));
    return out;
  },
  async getJSON(key){
    const raw = await Store.getRaw(key);
    if(!raw) return null;
    try{ return JSON.parse(raw); }catch(e){ return null; }
  },
  async setJSON(key, obj){
    return Store.setRaw(key, JSON.stringify(obj));
  }
};

/* ============================================================
   2. UTILS
   ============================================================ */
function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function nowISO(){ return new Date().toISOString(); }
function escapeHTML(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function truncate(str,n){ if(!str) return ''; return str.length>n ? str.slice(0,n-1)+'…' : str; }
function debounce(fn, ms){
  let t; return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), ms); };
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function showToast(msg, type='ok'){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = '<span class="toast-dot"></span>' + escapeHTML(msg);
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2200);
}
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

   4. PERSISTENCE HELPERS
   ============================================================ */
async function saveCategories(){ await Store.setJSON('app:categories', STATE.categories); }
async function saveSettings(){ await Store.setJSON('app:settings', STATE.settings); }
async function saveQuiz(quiz){ quiz.updatedAt = nowISO(); await Store.setJSON('quiz:'+quiz.id, quiz); }
async function deleteQuizStorage(id){ await Store.delete('quiz:'+id); }

const autosaveQuiz = debounce(async (quiz)=>{
  await saveQuiz(quiz);
  flashSavedIndicator();
}, 500);

function flashSavedIndicator(){
  const el = document.getElementById('saved-indicator');
  if(!el) return;
  el.style.opacity='1';
  clearTimeout(flashSavedIndicator._t);
  flashSavedIndicator._t = setTimeout(()=>{ if(el) el.style.opacity='0'; }, 1400);
}

/* ============================================================
   6. INIT / LOAD
   ============================================================ */
async function loadAll(){
  const [cats, settings, quizKeys] = await Promise.all([
    Store.getJSON('app:categories'),
    Store.getJSON('app:settings'),
    Store.list('quiz:')
  ]);
  STATE.categories = cats || [];
  STATE.settings = settings || { uiLanguage:'fr' };

  const quizzes = [];
  for(const k of quizKeys){
    const q = await Store.getJSON(k);
    if(q) quizzes.push(q);
  }
  STATE.quizzes = quizzes;

  if(STATE.categories.length===0 && STATE.quizzes.length===0){
    seedDemoData();
    await saveCategories();
    for(const q of STATE.quizzes) await saveQuiz(q);
  }
  STATE.ready = true;
  render();
}

document.addEventListener('DOMContentLoaded', ()=>{ initEventDelegation(); loadAll(); });

/* ============================================================
   8. IMAGE PROCESSING UTILITIES
   ============================================================ */
const ImageUtil = {
  _elCache:new Map(), _procCache:new Map(),
  loadEl(dataURL){
    if(this._elCache.has(dataURL)) return Promise.resolve(this._elCache.get(dataURL));
    return new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>{ this._elCache.set(dataURL,img); resolve(img); };
      img.onerror=reject;
      img.src=dataURL;
    });
  },
  fileToDataURL(file, maxDim=900, quality=0.85){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          const scale=Math.min(1, maxDim/Math.max(img.width,img.height));
          const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
          const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror=reject;
        img.src=reader.result;
      };
      reader.onerror=reject;
      reader.readAsDataURL(file);
    });
  },
  async pixelate(dataURL, pixelSize=16){
    const key='px:'+pixelSize+':'+dataURL.length;
    if(this._procCache.has(key)) return this._procCache.get(key);
    const img=await this.loadEl(dataURL);
    const w=img.width,h=img.height;
    const sw=Math.max(1,Math.round(w/pixelSize)), sh=Math.max(1,Math.round(h/pixelSize));
    const c1=document.createElement('canvas'); c1.width=sw; c1.height=sh;
    c1.getContext('2d').drawImage(img,0,0,sw,sh);
    const c2=document.createElement('canvas'); c2.width=w; c2.height=h;
    const ctx2=c2.getContext('2d'); ctx2.imageSmoothingEnabled=false;
    ctx2.drawImage(c1,0,0,sw,sh,0,0,w,h);
    const out=c2.toDataURL('image/jpeg',0.85);
    this._procCache.set(key,out);
    return out;
  },
  async silhouette(dataURL){
    const key='sil:'+dataURL.length;
    if(this._procCache.has(key)) return this._procCache.get(key);
    const img=await this.loadEl(dataURL);
    const w=img.width,h=img.height;
    const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0);
    const data=ctx.getImageData(0,0,w,h); const px=data.data;
    for(let i=0;i<px.length;i+=4){
      const lum=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
      if(lum<130){ px[i]=14;px[i+1]=12;px[i+2]=26; } else { px[i]=124;px[i+1]=92;px[i+2]=252; }
      px[i+3]=255;
    }
    ctx.putImageData(data,0,0);
    const out=canvas.toDataURL('image/jpeg',0.85);
    this._procCache.set(key,out);
    return out;
  }
};
function cssFilterForMode(mode, q){
  if(mode==='blurred') return 'blur('+((q&&q.blurPx)||16)+'px)';
  if(mode==='darkened') return 'brightness('+((q&&q.darkenAmt)||0.13)+')';
  return '';
}
let pendingModeImages=[];
function modeImageHTML(question, extraClass, wrapStyle){
  extraClass = extraClass||''; wrapStyle = wrapStyle||'';
  if(!question.image) return '';
  const mode = question.imageMode || 'normal';
  if(mode==='masked'){
    const r = question.maskRect || {x:25,y:25,w:50,h:50};
    return `<div class="${extraClass}" style="position:relative;overflow:hidden;${wrapStyle}">
      <img src="${question.image}" style="width:100%;height:100%;object-fit:contain;display:block;">
      <div style="position:absolute;left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;background:#17142b;border-radius:6px;"></div>
    </div>`;
  }
  if(mode==='pixelated' || mode==='silhouette'){
    const elId='mi_'+uid();
    pendingModeImages.push({elId, dataURL:question.image, mode, pixelSize:question.pixelSize||16});
    return `<img id="${elId}" class="${extraClass}" src="${question.image}" style="filter:blur(4px);opacity:.55;${wrapStyle}">`;
  }
  const filter = cssFilterForMode(mode, question);
  return `<img class="${extraClass} qedit-preview-img" src="${question.image}" style="${filter?('filter:'+filter+';'):''}${wrapStyle}">`;
}
async function flushPendingModeImages(){
  const jobs = pendingModeImages.splice(0);
  await Promise.all(jobs.map(async job=>{
    try{
      const out = job.mode==='pixelated' ? await ImageUtil.pixelate(job.dataURL, job.pixelSize) : await ImageUtil.silhouette(job.dataURL);
      const el = document.getElementById(job.elId);
      if(el){ el.src=out; el.style.filter=''; el.style.opacity='1'; }
    }catch(e){}
  }));
}

function getQuiz(id){ return STATE.quizzes.find(q=>q.id===id); }
function getCategory(id){ return STATE.categories.find(c=>c.id===id); }
function getFilteredQuizzes(){
  let list = STATE.quizzes.slice();
  const {search,category,difficulty,language,sort} = STATE.library;
  if(search){ const s=search.toLowerCase(); list=list.filter(q=>(q.name||'').toLowerCase().includes(s)||(q.description||'').toLowerCase().includes(s)); }
  if(category) list=list.filter(q=>(q.categoryIds||[]).includes(category));
  if(difficulty) list=list.filter(q=>q.difficulty===difficulty);
  if(language) list=list.filter(q=>q.language===language);
  if(sort==='updatedDesc') list.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  else if(sort==='createdDesc') list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  else if(sort==='nameAsc') list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  else if(sort==='qcount') list.sort((a,b)=>b.questions.length-a.questions.length);
  return list;
}

function renderMaskEditor(q){
  const r = q.maskRect || {x:25,y:25,w:50,h:50};
  return `<div class="mask-editor" id="qedit-mask-editor">
    <img src="${q.image}">

  </div>`;

let _maskCleanup = null;
function setupMaskEditorEvents(){
  const wrap = document.getElementById('qedit-mask-editor');
  if(!wrap) return;
  if(_maskCleanup){ _maskCleanup(); _maskCleanup=null; }
  const rectEl = document.getElementById('qedit-mask-rect');
  let dragging=false, startX=0, startY=0;
  function pct(e){
    const b = wrap.getBoundingClientRect();
    const cx = e.touches? e.touches[0].clientX : e.clientX;
    const cy = e.touches? e.touches[0].clientY : e.clientY;
    return { x:clamp(((cx-b.left)/b.width)*100,0,100), y:clamp(((cy-b.top)/b.height)*100,0,100) };
  }
  function down(e){ dragging=true; const p=pct(e); startX=p.x; startY=p.y;
    rectEl.style.left=startX+'%'; rectEl.style.top=startY+'%'; rectEl.style.width='0%'; rectEl.style.height='0%'; e.preventDefault(); }
  function move(e){ if(!dragging) return; const p=pct(e);
    const x=Math.min(startX,p.x), y=Math.min(startY,p.y), w=Math.abs(p.x-startX), h=Math.abs(p.y-startY);
    rectEl.style.left=x+'%'; rectEl.style.top=y+'%'; rectEl.style.width=w+'%'; rectEl.style.height=h+'%'; e.preventDefault(); }
  function up(){ if(!dragging) return; dragging=false;
    let x=parseFloat(rectEl.style.left), y=parseFloat(rectEl.style.top), w=parseFloat(rectEl.style.width), h=parseFloat(rectEl.style.height);
    if(w<8||h<8){ w=Math.max(w,20); h=Math.max(h,20); rectEl.style.width=w+'%'; rectEl.style.height=h+'%'; }
    if(STATE._questionDraft) STATE._questionDraft.maskRect = {x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h)};
  }
  wrap.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  wrap.addEventListener('touchstart',down,{passive:false}); wrap.addEventListener('touchmove',move,{passive:false}); wrap.addEventListener('touchend',up);
  _maskCleanup = ()=>{ window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
}

function setupQuestionListDnD(){
  const list = document.getElementById('q-list');
  if(!list) return;
  let dragEl=null;
  list.querySelectorAll('.q-row').forEach(row=>{
    row.addEventListener('dragstart', e=>{ dragEl=row; row.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); dragEl=null; commitQuestionReorder(); });
    row.addEventListener('dragover', e=>{
      e.preventDefault();
      if(!dragEl || dragEl===row) return;
      const rect = row.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height/2;
      row.parentNode.insertBefore(dragEl, after? row.nextSibling : row);
    });
  });
}
function commitQuestionReorder(){
  const quiz = getQuiz(STATE.currentQuizId);
  const listEl = document.getElementById('q-list');
  if(!quiz || !listEl) return;
  const ids = Array.from(listEl.querySelectorAll('.q-row')).map(r=>r.dataset.qid);
  quiz.questions.sort((a,b)=> ids.indexOf(a.id)-ids.indexOf(b.id));
  saveQuiz(quiz); flashSavedIndicator();
  render();
}

function saveQuestionFromModal(){
  const draft = STATE._questionDraft;
  const quiz = getQuiz(STATE._questionModalQuizId);
  if(!quiz || !draft) return;
  if(!draft.text || !draft.text.trim()){ showToast(tr('field_question_text'),'err'); return; }
  draft.answers = draft.answers.filter(a=>a.text && a.text.trim());
  if(draft.answers.length<2){ showToast(tr('field_answers'),'err'); return; }
  if(!draft.answers.find(a=>a.id===draft.correctAnswerId)){ showToast(tr('mark_correct_hint'),'err'); return; }
  if(draft.type==='guess_character' && !draft.image){ showToast(tr('field_character_image'),'err'); return; }
  draft.tags = (draft._tagsRaw||'').split(',').map(t=>t.trim()).filter(Boolean);
  delete draft._tagsRaw;
  const idx = quiz.questions.findIndex(qq=>qq.id===draft.id);
  if(idx>=0) quiz.questions[idx]=draft; else quiz.questions.push(draft);
  saveQuiz(quiz);
  closeQuestionModal();
  render();
  flashSavedIndicator();
}
function deleteQuestionFromModal(){
  const draft = STATE._questionDraft;
  const quiz = getQuiz(STATE._questionModalQuizId);
  if(!quiz || !draft) return;
  quiz.questions = quiz.questions.filter(q=>q.id!==draft.id);
  saveQuiz(quiz);
  closeQuestionModal();
  showToast(tr('toast_question_deleted'));
  render();
}

function startPlay(quizId, returnView){
  const quiz = getQuiz(quizId);
  if(!quiz || quiz.questions.length===0){ showToast(tr('empty_questions_title'),'err'); return; }
  STATE.play = { quizId, order: quiz.questions.map((_,i)=>i), pos:0, selectedId:null, revealed:false, correctCount:0, returnView: returnView||'library' };
  STATE.view = 'play';
  render();
}
function selectPlayAnswer(aid){
  const p = STATE.play; if(!p || p.revealed) return;
  const quiz = getQuiz(p.quizId); const q = quiz.questions[p.order[p.pos]];
  p.selectedId = aid; p.revealed = true;
  if(aid===q.correctAnswerId) p.correctCount++;
  render();
}
function nextPlayQuestion(){
  const p = STATE.play; if(!p) return;
  p.pos++; p.selectedId=null; p.revealed=false;
  render();
}

  if(!quiz){ STATE.view='library'; return renderLibrary(); }
  if(p.pos >= p.order.length) return renderScoreScreen(quiz,p);
  const q = quiz.questions[p.order[p.pos]];
  const type = QuestionTypes[q.type];
  const progressPct = Math.round((p.pos/p.order.length)*100);
  let imgHTML = '';
  if(q.image){
    if(q.type==='guess_character') imgHTML = `<div class="play-question-img" style="display:flex;align-items:center;justify-content:center;">${modeImageHTML(q,'', 'max-height:260px;max-width:100%;object-fit:contain;')}</div>`;

  const answersHTML = q.answers.map((a,idx)=>{
    const letter=letters[idx]; let cls='answer-tile '+letter;

      if(a.id===q.correctAnswerId) cls+=' correct-flag';

    }
    return `<div class="${cls}" data-action="select-answer" data-aid="${a.id}">${type.renderPlayTile(a,letter)}</div>`;
  }).join('');
  let feedback='';
  if(p.revealed){
    const wasCorrect = p.selectedId===q.correctAnswerId;
    feedback = `<div class="feedback-banner ${wasCorrect?'ok':'ko'}">${wasCorrect?Icons.check(16):Icons.x(16)} ${wasCorrect?tr('answer_correct'):tr('answer_wrong')}</div>`;
    if(q.explanation) feedback += `<div class="explanation-box">${escapeHTML(q.explanation)}</div>`;

/* ============================================================

let apTimers = { phaseTimeout:null, tickRAF:null };
let _stageEndActionsTimer = null;
function clearApTimers(){
  if(apTimers.phaseTimeout) clearTimeout(apTimers.phaseTimeout);
  if(apTimers.tickRAF) cancelAnimationFrame(apTimers.tickRAF);
  apTimers.phaseTimeout=null; apTimers.tickRAF=null;
}
function shuffleArray(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function launchAutoplayStage(){
  const s = STATE.autoplaySetup;
  const quiz = getQuiz(s.quizId);
  if(!quiz) return;
  let order = quiz.questions.map((_,i)=>i);
  if(s.shuffleQ) order = shuffleArray(order);
  STATE.autoplayEngine = {
    quizId:s.quizId, order, pos:0, phase:'intro',
    responseTime:s.responseTime, revealDuration:s.revealDuration, nextDelay:s.nextDelay, shuffleA:s.shuffleA,
    phaseStart:performance.now(), answerOrder:null, _answerOrderForQ:null,
    correctCount:0,
  };
  renderStageShell();
  updateStageHud(quiz, STATE.autoplayEngine);
  showIntroSplash(quiz, ()=>{
    const eng = STATE.autoplayEngine;
    if(!eng) return;
    eng.phase='counting';
    renderQuestionIntoStage(()=>runAutoplayPhaseTimer());
  });
}
function runAutoplayPhaseTimer(){
  clearApTimers();
  const eng = STATE.autoplayEngine;
  if(!eng) return;
  if(eng.phase==='counting'){
    eng.phaseStart = performance.now();
    tickCountdown();
    apTimers.phaseTimeout = setTimeout(()=>{
      eng.phase='revealing'; eng.phaseStart=performance.now();
      updateRevealVisuals();
      runAutoplayPhaseTimer();
    }, eng.responseTime*1000);
  } else if(eng.phase==='revealing'){
    apTimers.phaseTimeout = setTimeout(()=>{
      if(eng.pos >= eng.order.length-1){
        eng.phase='finished';
        renderFinishedStage();
      } else {
        eng.phase='pausing';
        apTimers.phaseTimeout = setTimeout(()=>{
          eng.pos++; eng.phase='counting';
          renderQuestionIntoStage(()=>runAutoplayPhaseTimer());
        }, eng.nextDelay*1000);
      }
    }, eng.revealDuration*1000);
  }
}
function tickCountdown(){
  const eng = STATE.autoplayEngine;
  if(!eng || eng.phase!=='counting') return;
  const elapsed = (performance.now()-eng.phaseStart)/1000;
  const remain = Math.max(0, eng.responseTime-elapsed);
  const pct = clamp(elapsed/eng.responseTime,0,1);
  updateCountdownDOM(remain,pct);
  apTimers.tickRAF = requestAnimationFrame(tickCountdown);
}
function updateCountdownDOM(remain,pct){
  const ringFg = document.getElementById('timer-ring-fg');
  const num = document.getElementById('timer-ring-num');
  const wrap = document.getElementById('timer-ring-wrap');
  if(ringFg){ const c=2*Math.PI*55; ringFg.style.strokeDasharray=c; ringFg.style.strokeDashoffset=c*pct; }
  if(num) num.textContent = Math.ceil(remain);
  if(wrap){ if(remain<=3 && remain>0) wrap.classList.add('urgent'); else wrap.classList.remove('urgent'); }
}

function renderQuestionIntoStage(onReady){
  const eng = STATE.autoplayEngine;
  const quiz = eng && getQuiz(eng.quizId);
  const content = document.getElementById('stage-content');
  if(!eng || !quiz || !content) return;
  const populate = () => { populateStageContent(eng, quiz, content); if(onReady) onReady(); };
  if(content.children.length){
    content.classList.add('stage-fade-out');
    setTimeout(populate, 280);
  } else {
    populate();
  }
}
function populateStageContent(eng, quiz, content){
  const q = quiz.questions[eng.order[eng.pos]];
  const type = QuestionTypes[q.type];
  if(eng._answerOrderForQ !== q.id){
    let ord = q.answers.map((_,i)=>i);
    if(eng.shuffleA) ord = shuffleArray(ord);
    eng.answerOrder = ord; eng._answerOrderForQ = q.id;
  }
  const letters=['a','b','c','d','e','f'];
let imgHTML='';
  if(q.image){
    if(q.type==='guess_character') imgHTML = `<div class="stage-qc-frame qfade-in" style="animation-delay:.08s;">${modeImageHTML(q,'stage-qc','')}</div>`;
    else imgHTML = `<div class="stage-qc-frame qfade-in" style="animation-delay:.08s;"><img class="stage-qc" src="${q.image}"></div>`;
  }
  const answersHTML = eng.answerOrder.map((ansIdx,i)=>{
    const a = q.answers[ansIdx]; const letter=letters[i];
    return `<div class="stage-tile ${letter}" data-aid="${a.id}" style="animation-delay:${(0.24+i*0.07).toFixed(2)}s">${type.renderPlayTile(a,letter)}</div>`;
  }).join('');
  const c = 2*Math.PI*34;
  const counter = document.getElementById('stage-qcounter');
  if(counter) counter.textContent = (eng.pos+1)+' / '+eng.order.length;
  content.classList.remove('stage-fade-out');
  content.innerHTML = `

    <div class="stage-answers">${answersHTML}</div>`;
  flushPendingModeImages();
  updateCountdownDOM(eng.responseTime,0);
}
function updateRevealVisuals(){
  const eng = STATE.autoplayEngine;
  const quiz = eng && getQuiz(eng.quizId);
  if(!eng || !quiz) return;
  const q = quiz.questions[eng.order[eng.pos]];
  const ringWrap = document.getElementById('timer-ring-wrap');
  if(ringWrap) ringWrap.style.display = 'none';
  document.querySelectorAll('#stage-content .stage-tile').forEach(tile=>{
    if(tile.dataset.aid === q.correctAnswerId){
      tile.classList.add('correct');
      const badge = document.createElement('span');
      badge.className = 'correct-badge';
      badge.innerHTML = Icons.check(20);
      tile.appendChild(badge);
    } else {
      tile.classList.add('dim');
    }
  });
  eng.correctCount++;
  updateStageHud(quiz, eng);
  if(q.explanation){
    const slot = document.getElementById('stage-explain-slot');
    if(slot) slot.innerHTML = `<div class="stage-explain"><b>${STATE.settings.uiLanguage==='en'?'Answer:':'Réponse :'}</b> ${escapeHTML(q.explanation)}</div>`;
  }
  const revealBar = document.getElementById('stage-revealbar');
  const revealText = document.getElementById('stage-revealbar-text');
  if(revealBar){
    revealBar.style.display = 'flex';
    if(revealText){
      const isLast = eng.pos >= eng.order.length-1;
      revealText.textContent = isLast
        ? (STATE.settings.uiLanguage==='en'?'Final question — see results in a moment…':'Dernière question — résultats dans un instant…')
        : (STATE.settings.uiLanguage==='en'?'Next question coming up…':'Prochaine question dans un instant…');
    }
  }
}
function renderFinishedStage(){
  const eng = STATE.autoplayEngine;
  const quiz = eng && getQuiz(eng.quizId);
  if(!eng || !quiz) return;
  clearApTimers();
  const counter = document.getElementById('stage-qcounter');
  if(counter) counter.textContent = eng.order.length+' / '+eng.order.length;
  const progressFill = document.getElementById('stage-progress-fill');
  if(progressFill) progressFill.style.width = '100%';
  const ltMeta = document.getElementById('stage-lt-meta');
  if(ltMeta) ltMeta.textContent = STATE.settings.uiLanguage==='en'?'Quiz complete':'Quiz terminé';
  const content = document.getElementById('stage-content');
  if(!content) return;
  const total = eng.order.length;
  const pct = total ? Math.round((eng.correctCount/total)*100) : 0;
  const trophy = pct===100 ? '🏆' : (pct>=70 ? '🎉' : (pct>=40 ? '👏' : '💪'));
  const verdict = pct===100
    ? (STATE.settings.uiLanguage==='en'?'Perfect score!':'Score parfait !')
    : (pct>=70
        ? (STATE.settings.uiLanguage==='en'?'Amazing!':'Bravo !')
        : (pct>=40
            ? (STATE.settings.uiLanguage==='en'?'Nice try!':'Bien joué !')
            : (STATE.settings.uiLanguage==='en'?'Keep practicing!':'Continue à t\u2019entraîner !')));
  const confettiColors = ['#7c5cfc','#2fd8c9','#ffb627','#ff5d6c','#35d07f','#c86bff','#5ecbff'];
  const confettiHTML = Array.from({length: 36}).map((_,i)=>{
    const left = Math.round(Math.random()*100);
    const delay = (Math.random()*1.4).toFixed(2);
    const dur = (1.8+Math.random()*1.4).toFixed(2);
    const color = confettiColors[i % confettiColors.length];
    const rot = Math.round(Math.random()*360);
    return `<div class="confetti" style="left:${left}%;background:${color};animation-delay:${delay}s;animation-duration:${dur}s;transform:rotate(${rot}deg);"></div>`;
  }).join('');
  content.innerHTML = `
    ${confettiHTML}
    <div class="stage-end qfade-in">
      <div class="stage-end-trophy">${trophy}</div>
      <div class="stage-end-title">${verdict}</div>
      <div class="stage-end-score">
        <div class="big">${pct}<span style="font-size:.6em;">%</span></div>
        <div class="small">${eng.correctCount} / ${total}</div>
      </div>
      <div class="stage-end-meter"><div class="stage-end-meter-fill" style="width:${pct}%;"></div></div>
      <div class="stage-end-meter-label">${tr('stage_thanks')}</div>
      <p class="stage-end-meta">${escapeHTML(quiz.name)} · ${total} ${tr(total===1?'q_count_1':'q_count')}</p>
      <div class="stage-end-actions" id="stage-end-actions" style="opacity:0;pointer-events:none;transition:opacity .6s ease;">
        <button class="btn btn-outline" data-action="exit-autoplay-stage">${tr('stage_exit_lib')}</button>
        <button class="btn btn-primary" data-action="replay-autoplay-stage">${Icons.repeat(14)} ${tr('stage_replay')}</button>
      </div>
    </div>`;
  clearTimeout(_stageEndActionsTimer);
  _stageEndActionsTimer = setTimeout(()=>{
    const el = document.getElementById('stage-end-actions');
    if(el){ el.style.opacity='1'; el.style.pointerEvents='auto'; }
  }, 3500);

function createNewQuiz(){
  const quiz = { id:uid(), name:'', description:'', categoryIds:[], language: STATE.settings.uiLanguage==='en'?'en':'fr',
    thumbnail:null, difficulty:'moyen', createdAt:nowISO(), updatedAt:nowISO(), questions:[] };
  STATE.quizzes.push(quiz);
  saveQuiz(quiz);
  STATE.currentQuizId = quiz.id;
  STATE.view = 'quizEditor';
  render();
}
function duplicateQuiz(id){
  const q = getQuiz(id); if(!q) return;
  const suffix = STATE.settings.uiLanguage==='en' ? ' (copy)' : ' (copie)';
  const copy = JSON.parse(JSON.stringify(q));
  copy.id = uid(); copy.name = (q.name||'') + suffix; copy.isDemo=false;
  copy.createdAt = nowISO(); copy.updatedAt = nowISO();
  copy.questions = copy.questions.map(qq=>{
    const oldToNew = {};
    const nq = JSON.parse(JSON.stringify(qq));
    nq.answers = qq.answers.map(a=>{ const nid=uid(); oldToNew[a.id]=nid; return {...a,id:nid}; });
    nq.correctAnswerId = oldToNew[qq.correctAnswerId];
    nq.id = uid();
    return nq;
  });
  STATE.quizzes.push(copy);
  saveQuiz(copy);
  render();
  showToast(tr('toast_quiz_duplicated'));
}
function doDeleteQuiz(id){
  STATE.quizzes = STATE.quizzes.filter(q=>q.id!==id);
  deleteQuizStorage(id);
  if(STATE.currentQuizId===id){ STATE.currentQuizId=null; STATE.view='library'; }
  render();
  showToast(tr('toast_quiz_deleted'));
}
function sanitizeFilename(s){
  return (s||'quiz').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'quiz';
}
function exportSingleQuiz(quiz){
  const cats = STATE.categories.filter(c=>(quiz.categoryIds||[]).includes(c.id));
  downloadJSON({ version:1, exportedAt:nowISO(), categories:cats, quizzes:[quiz] }, sanitizeFilename(quiz.name)+'.json');

async function handleImportFile(file){
  try{
